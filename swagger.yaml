openapi: 3.0.0
info:
  title: Image Analysis API
  description: API for analyzing images using Ollama models
  version: 1.0.0
servers:
  - url: http://localhost:3001/api
    description: Local development server
paths:
  /analitzar-imatge:
    post:
      summary: Analyze an image using AI model
      description: Processes one or more images with an AI model and returns analysis results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - images
                - stream
              properties:
                prompt:
                  type: string
                  description: The prompt to guide the image analysis
                  example: "Describe what you see in this image"
                images:
                  type: array
                  items:
                    type: string
                    format: base64
                  description: Array of base64-encoded image strings
                  example: ["iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAaklEQVQ4T2NkoBAwYtOv9p/hPzbxW4wMGOoxBHBphhmIbgiKAYQ0YzMEbgCxmtENARtAqmZkQ0YNYGCkTizAQpXY2EBOTNRNiYRcQlReQM5EDVGQTNWwDDMTwdRhzY0wyfpIhv+gYMZnAAD8Ci0RnkOJhgAAAABJRU5ErkJgggAA"]
                stream:
                  type: boolean
                  description: Whether to stream the response or return it all at once
                  example: false
      responses:
        '200':
          description: Successful analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Image analysis complete"
                  data:
                    type: object
                    properties:
                      description:
                        type: string
                        example: "The image shows..."
                      processing_time:
                        type: string
                        example: "2.45"
                      model_used:
                        type: string
                        example: "llava"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Invalid or missing parameter: prompt (must be string)"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Error processing request"
                  error:
                    type: string
                    example: "Internal server error"